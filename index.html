<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mocor Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 240px;
      height: 320px;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    
    /* Top Navigation Bar */
    #nav-bar {
      width: 240px;
      height: 32px;
      background: #222;
      display: flex;
      align-items: center;
      padding: 2px 4px;
      border-bottom: 1px solid #444;
      z-index: 100;
      position: relative;
    }
    #url-input {
      width: 175px;
      height: 24px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      font-size: 11px;
      padding: 0 4px;
      border-radius: 3px;
    }
    #url-input:focus {
      outline: 1px solid #00d2ff;
      background: #444;
    }
    #go-btn {
      width: 50px;
      height: 24px;
      margin-left: 4px;
      background: #0088cc;
      color: white;
      border: none;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    /* Browser Canvas Container */
    #viewport {
      width: 240px;
      height: 288px;
      position: relative;
      background: #fff;
      overflow: hidden;
    }
    #web-frame {
      width: 100%;
      height: 100%;
      border: none;
      transform-origin: 0 0;
    }

    /* Virtual Mouse Pointer Overlay */
    #cursor {
      width: 16px;
      height: 16px;
      position: absolute;
      top: 144px;
      left: 120px;
      pointer-events: none;
      z-index: 9999;
    }
    #cursor svg {
      width: 16px;
      height: 16px;
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8));
    }

    /* On-Screen Status Indicator */
    #status-bar {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ffcc;
      font-size: 9px;
      padding: 2px 4px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9998;
    }
  </style>
</head>
<body>

  <div id="nav-bar">
    <input type="text" id="url-input" value="https://example.com" placeholder="Enter URL (* key)">
    <button id="go-btn" onclick="loadUrl()">GO</button>
  </div>

  <div id="viewport">
    <iframe id="web-frame" src="https://example.com"></iframe>
    
    <!-- Virtual Pointer SVG -->
    <div id="cursor">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.5 3L19 12.5L12 14.5L8.5 21L4.5 3Z" fill="#FF0000" stroke="#FFFFFF" stroke-width="2"/>
      </svg>
    </div>

    <div id="status-bar">X: 120 | Y: 144</div>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    const iframe = document.getElementById('web-frame');
    const urlInput = document.getElementById('url-input');
    const statusBar = document.getElementById('status-bar');

    // Pointer position and speed configuration
    let posX = 120;
    let posY = 144;
    const speed = 6;
    const bounds = { minX: 0, maxX: 230, minY: 0, maxY: 275 };
    let currentZoom = 1.0;

    function updateCursorPosition(dx, dy) {
      posX = Math.max(bounds.minX, Math.min(bounds.maxX, posX + dx));
      posY = Math.max(bounds.minY, Math.min(bounds.maxY, posY + dy));
      
      cursor.style.left = posX + 'px';
      cursor.style.top = posY + 'px';
      
      statusBar.innerText = `X: ${Math.round(posX)} | Y: ${Math.round(posY)}`;
    }

    function loadUrl() {
      let url = urlInput.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      iframe.src = url;
      urlInput.blur();
    }

    function triggerClick() {
      // Visual feedback on click
      cursor.style.transform = 'scale(0.8)';
      setTimeout(() => cursor.style.transform = 'scale(1.0)', 150);

      // Element detection at current cursor coordinates
      const targetElement = document.elementFromPoint(posX, posY + 32);

      if (targetElement) {
        targetElement.click();
        if (targetElement.tagName === 'INPUT' || targetElement.tagName === 'BUTTON') {
          targetElement.focus();
        }
      }
    }

    // Keypad and DPAD Listener
    window.addEventListener('keydown', function (e) {
      // Prevent scrolling page when moving cursor
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
        if (document.activeElement !== urlInput) {
          e.preventDefault();
        }
      }

      if (document.activeElement === urlInput && e.key !== 'Escape') {
        if (e.key === 'Enter') loadUrl();
        return;
      }

      switch (e.key) {
        // DPAD Movement
        case 'ArrowUp':
          updateCursorPosition(0, -speed);
          break;
        case 'ArrowDown':
          updateCursorPosition(0, speed);
          break;
        case 'ArrowLeft':
          updateCursorPosition(-speed, 0);
          break;
        case 'ArrowRight':
          updateCursorPosition(speed, 0);
          break;

        // OK / Center Button Click
        case 'Enter':
        case 'Select':
          triggerClick();
          break;

        // Keypad Shortcuts
        case '1': // Zoom In
          currentZoom = Math.min(2.0, currentZoom + 0.1);
          iframe.style.transform = `scale(${currentZoom})`;
          break;
        case '3': // Zoom Out
          currentZoom = Math.max(0.5, currentZoom - 0.1);
          iframe.style.transform = `scale(${currentZoom})`;
          break;
        case '7': // Scroll Up
          iframe.contentWindow.scrollBy(0, -100);
          break;
        case '9': // Scroll Down
          iframe.contentWindow.scrollBy(0, 100);
          break;
        case '*': // Quick Address focus
          urlInput.focus();
          urlInput.select();
          break;
        case '#': // Clear input / Blur
          urlInput.blur();
          break;
      }
    });
  </script>
</body>
</html>
