<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Point Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 240px;
      height: 320px;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    
    /* Top Navigation Bar */
    #nav-bar {
      width: 240px;
      height: 32px;
      background: #222;
      display: flex;
      align-items: center;
      padding: 2px 4px;
      border-bottom: 1px solid #444;
      z-index: 100;
      position: relative;
    }
    .incognito-theme #nav-bar {
      background: #2a1135;
      border-bottom-color: #552266;
    }

    #url-input {
      width: 145px;
      height: 24px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      font-size: 10px;
      padding: 0 4px;
      border-radius: 3px;
    }
    #url-input:focus {
      outline: 1px solid #00d2ff;
      background: #444;
    }
    .nav-btn {
      width: 26px;
      height: 24px;
      margin-left: 3px;
      background: #444;
      color: white;
      border: 1px solid #666;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #go-btn {
      width: 34px;
      height: 24px;
      margin-left: 3px;
      background: #0088cc;
      color: white;
      border: none;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    /* Browser Canvas Container */
    #viewport {
      width: 240px;
      height: 288px;
      position: relative;
      background: #fff;
      overflow: hidden;
    }
    #web-frame {
      width: 100%;
      height: 100%;
      border: none;
      transform-origin: 0 0;
      display: none;
    }

    /* Start Page / Dashboard */
    #start-page {
      width: 100%;
      height: 100%;
      background: #181818;
      padding: 10px;
      overflow-y: auto;
      display: block;
    }
    .incognito-theme #start-page {
      background: #180820;
    }
    .section-title {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bookmark-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .bookmark-card {
      background: #282828;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }
    .bookmark-card:hover, .bookmark-card.selected {
      background: #383838;
      border-color: #0088cc;
    }
    .bookmark-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }
    .bookmark-name {
      font-size: 10px;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    /* Virtual Mouse Pointer Overlay */
    #cursor {
      width: 16px;
      height: 16px;
      position: absolute;
      top: 144px;
      left: 120px;
      pointer-events: none;
      z-index: 9999;
    }
    #cursor svg {
      width: 16px;
      height: 16px;
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8));
    }

    /* On-Screen Status Indicator */
    #status-bar {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ffcc;
      font-size: 9px;
      padding: 2px 4px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9998;
    }
    .incognito-theme #status-bar {
      color: #cc88ff;
    }
  </style>
</head>
<body>

  <div id="nav-bar">
    <input type="text" id="url-input" value="" placeholder="Enter URL (* key)">
    <button class="nav-btn" id="home-btn" title="Home" onclick="goHome()">🏠</button>
    <button class="nav-btn" id="incog-btn" title="Incognito" onclick="toggleIncognito()">🕵️</button>
    <button id="go-btn" onclick="loadUrl()">GO</button>
  </div>

  <div id="viewport">
    <!-- Start Page Dashboard -->
    <div id="start-page">
      <div class="section-title">Bookmarks & Start Page</div>
      <div class="bookmark-grid" id="bookmark-grid">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Web Frame -->
    <iframe id="web-frame" src=""></iframe>
    
    <!-- Virtual Pointer SVG -->
    <div id="cursor">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.5 3L19 12.5L12 14.5L8.5 21L4.5 3Z" fill="#FF0000" stroke="#FFFFFF" stroke-width="2"/>
      </svg>
    </div>

    <div id="status-bar">HOME | X: 120 Y: 144</div>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    const iframe = document.getElementById('web-frame');
    const startPage = document.getElementById('start-page');
    const urlInput = document.getElementById('url-input');
    const statusBar = document.getElementById('status-bar');
    const bookmarkGrid = document.getElementById('bookmark-grid');

    // Pointer variables
    let posX = 120;
    let posY = 144;
    const speed = 6;
    const bounds = { minX: 0, maxX: 230, minY: 0, maxY: 275 };
    let currentZoom = 1.0;
    let isIncognito = false;

    // Default Bookmarks with custom icons & colors
    const bookmarks = [
      { name: "Google", url: "https://www.google.com", color: "#4285F4", icon: "G" },
      { name: "Facebook", url: "https://m.facebook.com", color: "#1877F2", icon: "f" },
      { name: "YouTube", url: "https://m.youtube.com", color: "#FF0000", icon: "▶" },
      { name: "Java", url: "https://sadman-34.github.io/j2me-hub/", color: "#00AA55", icon: "☕" }
    ];

    function renderBookmarks() {
      bookmarkGrid.innerHTML = '';
      bookmarks.forEach((bm, index) => {
        const card = document.createElement('div');
        card.className = 'bookmark-card';
        card.innerHTML = `
          <div class="bookmark-icon" style="background:${bm.color}">${bm.icon}</div>
          <div class="bookmark-name">${bm.name}</div>
        `;
        card.onclick = () => navigateTo(bm.url);
        bookmarkGrid.appendChild(card);
      });
    }

    function updateCursorPosition(dx, dy) {
      posX = Math.max(bounds.minX, Math.min(bounds.maxX, posX + dx));
      posY = Math.max(bounds.minY, Math.min(bounds.maxY, posY + dy));
      
      cursor.style.left = posX + 'px';
      cursor.style.top = posY + 'px';
      
      const modeTxt = isIncognito ? "INCOGNITO" : (iframe.style.display === 'block' ? "WEB" : "HOME");
      statusBar.innerText = `${modeTxt} | X:${Math.round(posX)} Y:${Math.round(posY)}`;
    }

    function navigateTo(url) {
      startPage.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = url;
      urlInput.value = url;
      updateCursorPosition(0, 0);
    }

    function goHome() {
      iframe.style.display = 'none';
      startPage.style.display = 'block';
      urlInput.value = '';
      updateCursorPosition(0, 0);
    }

    function toggleIncognito() {
      isIncognito = !isIncognito;
      document.body.classList.toggle('incognito-theme', isIncognito);
      const incogBtn = document.getElementById('incog-btn');
      incogBtn.style.background = isIncognito ? '#662288' : '#444';
      updateCursorPosition(0, 0);
    }

    function loadUrl() {
      let url = urlInput.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      navigateTo(url);
      urlInput.blur();
    }

    function triggerClick() {
      cursor.style.transform = 'scale(0.8)';
      setTimeout(() => cursor.style.transform = 'scale(1.0)', 150);

      // Check if clicking inside start page or iframe
      if (startPage.style.display !== 'none') {
        const targetElement = document.elementFromPoint(posX, posY + 32);
        const card = targetElement ? targetElement.closest('.bookmark-card') : null;
        if (card) {
          const index = Array.from(bookmarkGrid.children).indexOf(card);
          if (index > -1 && bookmarks[index]) {
            navigateTo(bookmarks[index].url);
          }
        }
      } else {
        const targetElement = document.elementFromPoint(posX, posY + 32);
        if (targetElement) {
          targetElement.click();
          if (['INPUT', 'BUTTON', 'A'].includes(targetElement.tagName)) {
            targetElement.focus();
          }
        }
      }
    }

    // Keypad and DPAD Listener
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.key)) {
        if (document.activeElement !== urlInput) {
          e.preventDefault();
        }
      }

      if (document.activeElement === urlInput && e.key !== 'Escape') {
        if (e.key === 'Enter') loadUrl();
        return;
      }

      switch (e.key) {
        case 'ArrowUp': updateCursorPosition(0, -speed); break;
        case 'ArrowDown': updateCursorPosition(0, speed); break;
        case 'ArrowLeft': updateCursorPosition(-speed, 0); break;
        case 'ArrowRight': updateCursorPosition(speed, 0); break;
        case 'Enter':
        case 'Select':
          triggerClick();
          break;
        case '1': // Zoom In
          currentZoom = Math.min(2.0, currentZoom + 0.1);
          iframe.style.transform = `scale(${currentZoom})`;
          break;
        case '3': // Zoom Out
          currentZoom = Math.max(0.5, currentZoom - 0.1);
          iframe.style.transform = `scale(${currentZoom})`;
          break;
        case '7': // Scroll Up / Page Up
          if (iframe.style.display === 'block') iframe.contentWindow.scrollBy(0, -100);
          else startPage.scrollBy(0, -50);
          break;
        case '9': // Scroll Down / Page Down
          if (iframe.style.display === 'block') iframe.contentWindow.scrollBy(0, 100);
          else startPage.scrollBy(0, 50);
          break;
        case '*': // Focus URL bar
          urlInput.focus();
          urlInput.select();
          break;
        case '#': // Return Home / Start Page
          goHome();
          break;
      }
    });

    // Initialize Start Page
    renderBookmarks();
  </script>
</body>
</html>
